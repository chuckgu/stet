name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without a leading v, for example 0.2.0"
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Integration tests skip themselves without STET_TEST_PG.
      - run: go test ./...
      - name: Work out the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then v=${REF_NAME#v}; else v=${INPUT_VERSION#v}; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: scripts/release.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: stet-${{ matrix.os }}
          path: dist/*
