# Stet 설정 예. 형식은 docs/spec-v0.1.md 9장을 따른다.

mode: shadow                 # shadow | enforce
# 에이전트의 접속 계정(시작 패킷의 user) 목록. 대소문자까지 같아야 한다. enforce에서는 필수이고,
# 판정은 이 계정들의 세션에만 적용된다. 섀도에서 없으면 모든 세션을 본다. upstream의 계정(Stet 자신)은
# 넣을 수 없다. enforce로 시작할 때 Stet은 이 계정들을 확인해 경고한다(있는지, superuser이거나 superuser
# 역할의 구성원인지, stet 스키마에 권한이 있는지, 객체를 만들 수 있는지(데이터베이스의 TEMPORARY·CREATE,
# 스키마의 CREATE나 소유), 게이트 대상 테이블의 소유자인지, 역할 수준 search_path가 Stet의 것과 다른지.
# 권한과 소유는 PUBLIC에 준 것과 SET ROLE로 될 수 있는 역할을 거친 것도 센다).
# Stet이 접속한 계정이 목록에 있으면 시작하지 않는다. enforce에서는 서버의 db_user_namespace가 켜져 있을
# 때도, 그 설정이나 Stet이 접속한 계정을 확인하지 못했을 때도 시작하지 않는다.
# Stet의 계정은 각 에이전트 계정의 구성원이어야 하고(GRANT agent_x TO <Stet 계정>) superuser가 아니어야 한다.
# 승인된 쓰기를 Stet의 연결에서 그 에이전트 계정으로 실행하기 때문이다. enforce로 시작할 때 둘 다 확인해 경고한다.
# 운영자가 DB에서 해 둘 일은 docs/spec-v0.2-enforce.md 8장과 docs/spec-v0.2-approve.md 6·10장에 있다.
# agents:
#   roles: [agent_enricher, agent_support]
# 동시에 판단 중인 쓰기의 상한. 상태 읽기, 영향 측정, 모델 호출을 합친 수다. 기본 32
# limits:
#   max_inflight: 32
# 보류 건의 승인(docs/spec-v0.2-approve.md). expire_after는 보류 건을 승인할 수 있는 기간이다. 1m 이상 30d 이하,
# 기본 24h. apply_timeout은 승인된 쓰기 하나를 실행하는 시간의 상한이다. 1s 이상 10m 이하, 기본 30s.
# 섀도에서도 검증하지만 쓰이지 않는다. 승인된 쓰기는 enforce로 도는 Stet만 실행한다.
# held:
#   expire_after: 24h
#   apply_timeout: 30s
# 검토자는 DB 계정이다. stet.review를 읽고 stet.approve(id)나 stet.reject(id)를 부른다. Stet은 역할을 만들지
# 않는다. 운영자가 검토자에게 줄 권한은 아래 셋이다. 에이전트 계정에는 주지 않는다.
#   GRANT USAGE ON SCHEMA stet TO reviewer;
#   GRANT SELECT ON stet.review TO reviewer;
#   GRANT EXECUTE ON FUNCTION stet.approve(uuid, text, bigint), stet.reject(uuid, text) TO reviewer;
listen: 0.0.0.0:6432
upstream: postgres://app@db:5432/crm

# jev는 환경 변수 TYPESAFE_API_KEY가 필요하다. 키는 이 파일에 두지 않는다.
# 모델 없이 상태·쓰기·결과만 기록하려면 model: {adapter: none}으로 둔다. enforce에서 adapter: none은
# on_failure: pass를 직접 적어야 받는다(값 판단 없이 영향 한도만 쓴다는 뜻).
model:
  adapter: jev
  version: jev-1.14.0        # 고정 필수. jev-X.Y.Z 형식만 (latest·preview 거부)
  timeout_ms: 800            # enforce에서는 에이전트가 모델의 판단을 기다리는 시간의 상한이기도 하다
  on_failure: pass           # pass | hold. 적지 않으면 섀도는 pass, enforce는 hold. enforce에서 pass면 시작할 때 경고한다

retention: 90d

tables:
  contacts:
    pk: id
    entity: "B2B CRM contact"
    send_fields: [name, email, company_id, title, status, notes]   # 필수. 모델이 볼 컬럼
    candidates:              # pg_trgm 필요. 고른 컬럼이 그대로 모델로 가며, PK를 꼭 고른다
      sql: |
        SELECT id, name, email, company_id, title, updated_at
        FROM contacts
        WHERE lower(email) = lower(:email)
           OR (company_id = :company_id AND similarity(name, :name) > 0.4)
        LIMIT 10
    recent_window: 30m
    questions: [duplicate, conflict, policy]
    policy: |                # 한 줄에 규칙 하나. 규칙마다 따로 묻는다 (목록으로 써도 된다)
      Do not set status to 'churned' while the account has an open deal.
      Do not overwrite a title with an older value from a stale source.
    thresholds:
      duplicate: 0.85
      conflict: 0.80
      policy: 0.8            # 규칙을 어겼을 확률이 0.8 이상이면 hold
      policy_escalate: 0.5   # 0.5 이상 0.8 미만이면 escalate
      escalate_below: 0.60
    # 측정은 클라이언트의 역할로 한다. 그래서 Stet의 upstream 계정에 에이전트 역할을
    # 하나씩 부여해야 한다: GRANT agent_x TO <Stet 계정>. 부여되지 않은 역할의 쓰기는
    # 측정 실패로 기록된다.
    impact:                  # 없으면 다중 행 쓰기는 unsupported로 기록된다
      max_rows: 100          # 필수. 이보다 많이 걸리면 hold
      max_share: 0.1         # 선택. UPDATE·DELETE가 테이블의 10%를 넘게 걸리면 hold
      cumulative:            # 선택. 접속 계정 하나가 window 안에 이 테이블에서 건드린 행의 합계 한도. 쓰면 두 값 모두 필수
        max_rows: 500        # impact.max_rows 이상. 합계가 이를 넘으면 hold
        window: 10m          # 초 단위로 떨어지는 값. 1s 이상 24h 이하
    reads:                   # 선택. 있으면 (값 없이 reads:만 써도) 이 테이블의 읽기를 기록한다
      log_above: 1000        # 선택. 한 읽기가 이보다 많은 행을 보내면 따로 기록한다 (없으면 집계만). 커서와 나눠 가져가는 포털은 합계로 본다
    stale:                   # 선택. 있으면 (값 없이 stale:만 써도) 이 테이블의 낡은 쓰기를 본다 (docs/spec-v0.2-stale.md)
      # 에이전트가 읽은 행의 버전을 기억해 두었다가, 같은 계정이 그 행을 쓸 때 그사이 다른 쪽이 바꿨으면 stale_read로 거부한다.
      # 놓치는 것: 같은 접속 계정을 여럿이 나눠 쓰면서 업무(on_behalf_of)를 적지 않으면 기억이 흐려져 낡은 쓰기를 놓칠 수 있다.
      # 키 값 1,000개를 넘는 목록, 커서로 읽은 행, 키 컬럼 없는 집계처럼 Stet이 키를 다 얻지 못한 읽기는 그 계정의 이 테이블
      # 기억을 비운다. 그런 읽기가 잦은 에이전트는 이 테이블에서 거의 판정받지 않는다. 쓰기 전에 그 행을 키로 읽게 한다.
      remember: 1h           # 선택. 읽은 버전을 기억하는 시간. 1m 이상 24h 이하. 기본 1h
    unsupported: reject

# 되돌리기(docs/spec-v0.2-undo.md). 에이전트 계정(agents.roles. 섀도에서 없으면 모든 세션)이 바꾼 행의 이전·이후
# 값을 DB의 트리거가 쓰기와 같은 트랜잭션에서 남기고, 검토자가 계정·시간·테이블로 골라 되돌린다. 두 모드에서 같다.
# 켜는 순서(docs/lab.md의 "되돌리기"):
#   1. 아래 절을 적고 Stet을 한 번 시작한다. Stet이 stet 스키마를 만들고 캡처 설정을 맞춘다.
#   2. stet undo-sql -config stet.yaml 이 설치 SQL을 출력한다. 묶음마다 머리에 적힌 계정(Stet의 계정, 테이블
#      소유자)이 실행한다. Stet은 고객의 테이블에 아무것도 설치하지 않는다. PostgreSQL 14 이상이 필요하다.
#   3. stet undo-sql -config stet.yaml -grant reviewer 가 검토자에게 줄 권한을 출력한다. Stet의 계정이 실행한다.
#      되돌릴 테이블의 SELECT·INSERT·UPDATE·DELETE와, 그 테이블을 연쇄 외래 키로 가리키는 테이블의 SELECT는
#      테이블 소유자가 준다.
# 검토자는 READ COMMITTED 트랜잭션에서 stet.undo_plan('<계정>', '<언제부터>')로 무엇이 되돌려질지 보고,
# stet.undo(...)로 되돌린 뒤 결과의 줄을 보고 COMMIT하거나 ROLLBACK한다.
# Stet은 시작할 때 트리거가 없거나 출력과 다른 테이블을 경고하고 stet undo-sql을 실행하라고 말한다.
# 끌 때는 stet undo-sql -config stet.yaml -drop 의 출력을 소유자가 실행하고 이 절을 지운다. 어느 쪽을 먼저 해도 된다.
# 절만 지우고 트리거를 남기면 캡처는 계속되고 오래된 기록은 지워지지 않는다. Stet이 시작할 때 경고한다(docs/lab.md).
# undo:
#   tables:                  # 필수. 되돌리기를 켤 테이블. 키 컬럼은 기본 키이거나 NOT NULL이고 유일한 컬럼 하나다
#     contacts:              # tables의 키. 키 컬럼은 거기서 가져온다
#     public.deal_notes:     # 게이트 대상이 아닌 테이블(연쇄로 바뀌는 자식 등). 키 컬럼을 적는다
#       pk: id
#   max_rows: 10000          # 한 문장이 이보다 많은 행을 바꾸면 값 없이 표지만 남긴다. 1 이상 1,000,000 이하. 기본 10000
#   keep: 30d                # 변경 기록을 두는 기간. 1h 이상. 기본 30d. 한 시간마다 오래된 것을 지운다

# 낡은 쓰기 감지(docs/spec-v0.2-stale.md). 테이블에 stale을 켰을 때만 쓸 수 있고, 켠 테이블이 없으면 설정 오류다.
# stale:
#   max_keys: 200000         # 선택. 기억하는 행 버전의 전체 상한. 1000 이상 10000000 이하. 기본 200000
